baseURL = "https://www.dubaicalligrapher.com"
languageCode = "en-us"
title = "Dubai Calligrapher Directory"
theme = []

[params]
    description = "A curated editorial directory and professional reference for Arabic calligraphers in the UAE."
    author = "Editorial Board"
    accent = "#000000"

[taxonomies]
    emirate = "emirates"
    script = "scripts"

[permalinks]
    calligraphers = "/calligraphers/:slug/"
    arabic-scripts = "/arabic-scripts/:slug/"

[markup.goldmark.renderer]
    unsafe = true # Required for static forms in Markdown
